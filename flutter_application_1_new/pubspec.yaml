name: flutter_application_1_new
description: "Application Agent Terrain avec Firebase et UI personnalisée"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10
  intl: ^0.19.0
  geolocator: ^10.1.0
  fl_chart: ^0.66.0
  geocoding: ^2.0.5
  image_picker: ^1.0.4
  iconsax: ^0.0.8
  flutter_launcher_icons: ^0.13.1
  url_launcher: ^6.2.6


 
  path_provider: ^2.1.2
  permission_handler: ^11.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon/app_icon.png 


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true


   
